# CHFR LDN — Render blueprint (FREE tier).
#
# Web service: Render free plan.
# Database:    Neon (https://neon.tech) free tier — set DATABASE_URL by hand.
#
# Render's own free PostgreSQL is DELETED after 30 days, which would destroy
# every booking, so it is deliberately not used here. Neon's free tier is
# permanent. See render.paid.yaml for the production configuration
# (~$13/month, no sleeping, Render-managed Postgres with backups).
#
# Secrets marked `sync: false` are filled in once, by hand, in the Render
# dashboard — they are never committed to git.

services:
  - type: web
    name: chfr-ldn
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # --include=dev is required: NODE_ENV=production (set below) otherwise makes
    # npm skip devDependencies, and TypeScript itself is one of them.
    # Migrations run automatically at boot, so the build only compiles.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Paste the Neon connection string here in the Render dashboard.
      # It looks like:
      #   postgresql://user:pass@ep-xxx.eu-central-1.aws.neon.tech/chfr?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: 'true'
      - key: DB_DRIVER
        value: pg
      - key: TRUST_PROXY
        value: 'true'

      # Generated once by Render and then kept.
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true

      # Set to the Render URL first, then your live domain once DNS is pointed.
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        value: CHFRLONDON@GMAIL.COM
      # Short "new booking" ping, in addition to the full email above.
      # Blank, or the same as ADMIN_EMAIL, turns it off.
      - key: ALERT_EMAIL
        value: anjbaig@gmail.com
      # Customers reply to a mailbox someone reads, not to the From address.
      - key: EMAIL_REPLY_TO
        value: CHFRLONDON@GMAIL.COM

      # --- Email -------------------------------------------------------------
      # Render blocks outbound SMTP on ports 25/465/587, so email goes out over
      # HTTPS via Resend. SMTP_* is left here for local development and for
      # hosts that permit it.
      - key: EMAIL_PROVIDER
        value: auto
      - key: RESEND_API_KEY
        sync: false

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

      - key: SPREADSHEET_PROVIDER
        value: none
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: WHATSAPP_ENABLED
        value: 'false'
      - key: OPENWA_BASE_URL
        sync: false
      - key: OPENWA_API_KEY
        sync: false
      - key: OPENWA_SESSION_ID
        value: CHFR
      - key: CHFR_WHATSAPP_NUMBER
        sync: false

      # --- First admin account, or password recovery -------------------------
      # The free plan has no Shell, so this is how the account is made: set
      # both, deploy, sign in, then DELETE ADMIN_BOOTSTRAP_PASSWORD.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false

      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
